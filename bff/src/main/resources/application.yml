server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: metaforge-bff
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/metaforge}
    username: ${SPRING_DATASOURCE_USERNAME:metaforge_app}
    password: ${SPRING_DATASOURCE_PASSWORD:metaforge}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 5000
      max-lifetime: 1800000
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2s
  servlet:
    multipart:
      max-file-size: ${LCP_UPLOAD_MAX_FILE_SIZE:100MB}
      max-request-size: ${LCP_UPLOAD_MAX_REQUEST_SIZE:110MB}
  jackson:
    default-property-inclusion: non_null
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Shanghai

flowable:
  database-schema: flowable
  database-schema-update: true
  async-executor-activate: false
  async-history-executor-activate: false
  history-level: audit
  check-process-definitions: false
  process:
    enable-safe-xml: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

lcp:
  auth:
    jwt-secret: ${LCP_JWT_SECRET:metaforge-dev-secret-change-me}
    issuer: ${LCP_AUTH_ISSUER:metaforge}
    ttl-hours: ${LCP_AUTH_TTL_HOURS:12}
    # 仅开发环境：允许网关注入的 X-Tenant-Id / X-User-Id 兜底，生产必须关闭。
    dev-headers: ${LCP_AUTH_DEV_HEADERS:false}
    password:
      min-length: ${LCP_PASSWORD_MIN_LENGTH:8}
      max-length: ${LCP_PASSWORD_MAX_LENGTH:128}
      require-uppercase: ${LCP_PASSWORD_REQUIRE_UPPERCASE:false}
      require-lowercase: ${LCP_PASSWORD_REQUIRE_LOWERCASE:true}
      require-digit: ${LCP_PASSWORD_REQUIRE_DIGIT:true}
      require-symbol: ${LCP_PASSWORD_REQUIRE_SYMBOL:false}
    lockout:
      max-failed-attempts: ${LCP_AUTH_MAX_FAILED_ATTEMPTS:5}
      minutes: ${LCP_AUTH_LOCK_MINUTES:15}
  sso:
    enabled: ${LCP_SSO_ENABLED:false}
    mode: ${LCP_SSO_MODE:oidc}
    provider: ${LCP_SSO_PROVIDER:sso}
    display-name: ${LCP_SSO_DISPLAY_NAME:统一身份登录}
    tenant: ${LCP_SSO_TENANT:}
    client-id: ${LCP_SSO_CLIENT_ID:}
    client-secret: ${LCP_SSO_CLIENT_SECRET:}
    authorize-url: ${LCP_SSO_AUTHORIZE_URL:}
    token-url: ${LCP_SSO_TOKEN_URL:}
    userinfo-url: ${LCP_SSO_USERINFO_URL:}
    jwks-url: ${LCP_SSO_JWKS_URL:}
    issuer: ${LCP_SSO_ISSUER:}
    scopes: ${LCP_SSO_SCOPES:openid profile email}
    subject-claim: ${LCP_SSO_SUBJECT_CLAIM:sub}
    username-claim: ${LCP_SSO_USERNAME_CLAIM:preferred_username}
    email-claim: ${LCP_SSO_EMAIL_CLAIM:email}
    name-claim: ${LCP_SSO_NAME_CLAIM:name}
    redirect-uri: ${LCP_SSO_REDIRECT_URI:}
    frontend-base-url: ${LCP_SSO_FRONTEND_BASE_URL:}
    frontend-callback: ${LCP_SSO_FRONTEND_CALLBACK:/sso/callback}
    cas-server-url: ${LCP_SSO_CAS_SERVER_URL:}
    cas-validate-path: ${LCP_SSO_CAS_VALIDATE_PATH:/p3/serviceValidate}
    cas-attributes: ${LCP_SSO_CAS_ATTRIBUTES:true}
    allow-insecure-http: ${LCP_SSO_ALLOW_INSECURE_HTTP:false}
    link-by: ${LCP_SSO_LINK_BY:username}
    auto-create: ${LCP_SSO_AUTO_CREATE:false}
    state-ttl-minutes: ${LCP_SSO_STATE_TTL_MINUTES:10}
    ticket-ttl-seconds: ${LCP_SSO_TICKET_TTL_SECONDS:60}
  wechat:
    enabled: ${LCP_WECHAT_ENABLED:false}
    app-id: ${LCP_WECHAT_APP_ID:}
    app-secret: ${LCP_WECHAT_APP_SECRET:}
    tenant: ${LCP_WECHAT_TENANT:}
    display-name: ${LCP_WECHAT_DISPLAY_NAME:微信登录}
    link-by: ${LCP_WECHAT_LINK_BY:username}
    auto-create: ${LCP_WECHAT_AUTO_CREATE:false}
    # 仅本地假服务联调时覆盖；生产保持默认微信官方域名。
    api-base: ${LCP_WECHAT_API_BASE:https://api.weixin.qq.com}
    allow-insecure-http: ${LCP_WECHAT_ALLOW_INSECURE_HTTP:false}
  secrets:
    # Base64 编码的 32 字节主密钥；仅在读写密钥时校验，可为空。
    master-key: ${LCP_SECRET_MASTER_KEY:}
  connectors:
    # 本地联调可打开；staging/prod 保持 false。
    allow-private-networks: ${LCP_CONNECTOR_ALLOW_PRIVATE_NETWORKS:false}
    allow-insecure-http: ${LCP_CONNECTOR_ALLOW_INSECURE_HTTP:false}
  identity:
    # 仅开发环境：跳过组织管理员校验；生产设为 false。
    allow-all: ${LCP_IDENTITY_ALLOW_ALL:false}
  ai:
    enabled: ${LCP_AI_ENABLED:false}
    base-url: ${LCP_AI_BASE_URL:}
    api-key: ${LCP_AI_API_KEY:}
    model: ${LCP_AI_MODEL:}
    timeout-ms: ${LCP_AI_TIMEOUT_MS:20000}
  attachments:
    # 本地文件存储目录；生产可替换为 OSS 实现，对象键契约保持不变。
    dir: ${LCP_ATTACHMENT_DIR:./data/attachments}
  runtime:
    fallback-directory: ${LCP_RUNTIME_FALLBACK_DIRECTORY:true}
    dept-leader-user: ${LCP_RUNTIME_DEPT_LEADER_USER:bob}
    school-admin-user: ${LCP_RUNTIME_SCHOOL_ADMIN_USER:principal}
  tenant:
    header: ${LCP_TENANT_HEADER:X-Tenant-Id}
  user:
    header: ${LCP_USER_HEADER:X-User-Id}

logging:
  level:
    root: INFO
