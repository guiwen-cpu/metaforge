# =============================================================================
# Staging：dev 分支预发布流水线
#
# 触发：
#   - push dev：开发分支更新即发布预发
#   - workflow_dispatch：手动重跑（请选择 dev 分支）
#
# 链路：validate → images（阿里云 ACR）→ deploy（自动）
#   validate 与 ci.yml 的协议 / BFF 检查同源，但工作流之间没有依赖关系，
#   因此这里重复执行，保证“推镜像前一定校验过”。
#
# 产物（阿里云 ACR）：
#   <ACR_REGISTRY>/<ACR_NAMESPACE>/web:staging + :sha-<commit>
#   <ACR_REGISTRY>/<ACR_NAMESPACE>/bff:staging + :sha-<commit>
#   :staging 是可变指针；实际部署固定用 :sha-<commit>，便于追溯与回滚。
#
# 部署：
#   - push dev 后自动执行，无需额外开关
#   - 在 environment: staging 下执行（可在仓库设置里加审批与保护规则）
#   - SSH 到目标机 /opt/metaforge，检出本次 commit 后调用 deploy/release.sh staging
#   - 目标机需已有 deploy/.env.staging，并已 docker login ACR（或把 ACR 凭据写进该文件）
#   - release.sh 按 TAG 执行 pull → migrate → up
#
# 生产对应流程见 release.yml；日常门禁见 ci.yml；总览见 README.md。
# =============================================================================
name: staging

on:
  push:
    branches: [dev] # dev 分支更新即发布预发
  workflow_dispatch: # 支持手动重跑

# 镜像库地址与命名空间：可用仓库 Variables 覆盖。
# compose.<env>.yaml 用同名变量拼镜像名，三处默认值需保持一致。
env:
  ACR_REGISTRY: ${{ vars.ACR_REGISTRY || 'registry.cn-hangzhou.aliyuncs.com' }}
  ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE || 'metaforge' }}

# 预发发布串行化：同一环境同时只跑一条流水线。
# 不取消进行中的运行，避免中断镜像推送或 SSH 部署。
concurrency:
  group: deploy-staging
  cancel-in-progress: false

# ACR 登录用独立密钥，不再需要 GitHub Packages 的写权限
permissions:
  contents: read

jobs:
  # 与 ci.yml 的检查同源：损坏的协议或编译不过的 BFF 不进入镜像阶段。
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/validate.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -f bff/pom.xml -DskipTests package

  # 构建并推送预发镜像；needs 保证 validate 通过后才执行。
  images:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # 用阿里云 ACR 凭据登录；建议使用仅有制品仓库读写权限的 RAM 用户
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 前端镜像内置设计器与 /demo/；API 走同域反向代理，故 VITE_API_BASE 为空
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE=
            VITE_STS_URL=/api/v1/platform/oss/sts
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/web:staging
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/web:sha-${{ github.sha }}
          # GHA 缓存按 scope 隔离，避免与 release 工作流的构建缓存互相污染
          cache-from: type=gha,scope=staging-web
          cache-to: type=gha,mode=max,scope=staging-web

      - name: Build and push bff
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/bff/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/bff:staging
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/bff:sha-${{ github.sha }}
          cache-from: type=gha,scope=staging-bff
          cache-to: type=gha,mode=max,scope=staging-bff

  # 自动部署：镜像推完后，在目标机执行发布脚本。
  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: staging # 绑定环境密钥；可配置人工审批
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -eu
            cd /opt/metaforge
            # 目标机是 Git 检出时先检出本次构建的 commit；否则沿用机器上已有文件。
            # 只按 SHA 取对象，不再同步标签；checkout 后是 detached HEAD，正好锁定本次发布版本。
            if [ -d .git ]; then
              git fetch --prune origin "${{ github.sha }}"
              git checkout --force "${{ github.sha }}"
            fi
            # 目标机的 compose 覆盖层用这两个变量拼镜像名；未设置时脚本有同样的默认值
            export ACR_REGISTRY='${{ env.ACR_REGISTRY }}'
            export ACR_NAMESPACE='${{ env.ACR_NAMESPACE }}'
            # 固定用本次构建的 sha 标签，而不是可变的 :staging
            TAG=sha-${{ github.sha }} sh deploy/release.sh staging
