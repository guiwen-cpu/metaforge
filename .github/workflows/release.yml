# =============================================================================
# Release：main 分支生产发布流水线
#
# 触发：
#   - push main：主干合并即发布生产
#
# 链路：validate → images（GHCR）→ deploy（自动）
#   validate 与 ci.yml 同源，但工作流之间没有依赖关系，
#   因此这里重复执行，保证“推镜像前一定校验过”。
#
# 产物：
#   ghcr.io/<repo>/web:prod + :sha-<commit>
#   ghcr.io/<repo>/bff:prod + :sha-<commit>
#   :prod 是可变指针；部署固定使用 :sha-<commit>，便于追溯与回滚。
#
# 部署：
#   - push main 后自动执行，无需额外开关
#   - 在 environment: production 下执行（可配置人工审批与保护规则）
#   - SSH 到目标机 /opt/metaforge，切到 main 后调用 deploy/release.sh prod
#   - 部署使用本次构建的 sha 标签；目标机需已有 deploy/.env.prod
#
# 预发对应流程见 staging.yml；日常门禁见 ci.yml；总览见 README.md。
# =============================================================================
name: release

on:
  push:
    branches: [main] # 主干合并即发布生产

# 生产发布串行化：同一环境同时只跑一条流水线。
# 不取消进行中的运行，避免中断镜像推送或 SSH 部署。
concurrency:
  group: deploy-production
  cancel-in-progress: false

# 推送 GHCR 需要 packages: write；checkout 只需要 contents: read
permissions:
  contents: read
  packages: write

jobs:
  # 与 ci.yml 的检查同源：协议校验 + BFF 打包。
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/validate.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -f bff/pom.xml -DskipTests package

  # 构建并推送生产镜像；needs 保证 validate 通过后才执行。
  images:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # 用仓库自带 GITHUB_TOKEN 登录 GHCR，无需额外密钥
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 前端镜像内置设计器与 /demo/；API 走同域反向代理，故 VITE_API_BASE 为空
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE=
            VITE_STS_URL=/api/v1/platform/oss/sts
          tags: |
            ghcr.io/${{ github.repository }}/web:prod
            ghcr.io/${{ github.repository }}/web:sha-${{ github.sha }}
          # 与 staging 分开缓存，生产构建不会被预发产物影响
          cache-from: type=gha,scope=prod-web
          cache-to: type=gha,mode=max,scope=prod-web

      - name: Build and push bff
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/bff/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/bff:prod
            ghcr.io/${{ github.repository }}/bff:sha-${{ github.sha }}
          cache-from: type=gha,scope=prod-bff
          cache-to: type=gha,mode=max,scope=prod-bff

  # 自动部署：镜像推完后，在目标机执行生产发布脚本。
  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production # 绑定生产环境密钥；建议配置人工审批
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -eu
            cd /opt/metaforge
            # 目标机是 Git 检出时对齐 main；否则沿用机器上已有文件
            if [ -d .git ]; then
              git fetch --tags --force
              git checkout --force main
              git pull --ff-only
            fi
            # 固定用本次构建的 sha 标签，并执行 pull → migrate → up
            TAG=sha-${{ github.sha }} sh deploy/release.sh prod
