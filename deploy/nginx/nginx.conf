# 因为外层（DevShare 的 Nginx）已经接管了公网流量和 HTTPS，
# 这个内部 Nginx 只需要监听内部端口即可，不需要处理证书和跨端口跳转。

server {
    # 容器内部统一监听 8080 端口即可（nginx-unprivileged 不允许用 80）
    listen 8080;
    
    # 因为外层转发过来时 Host 是 meta.devshare.bond，所以这里匹配即可
    server_name meta.devshare.bond;

    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 健康检查保留，方便 Docker 探针检测
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 ok;
    }

    # 全局代理基础配置
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    
    # ⚠️ 核心细节：告诉后端（bff）外层用的是 HTTPS
    # 因为你外层 DevShare 是 HTTPS，转到这里变成了 HTTP，为了不让 Java 后端生成错误的重定向链接，必须强行传 https
    proxy_set_header X-Forwarded-Proto https; 
    
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # 文件字节走 OSS STS 直传，这里只承载 JSON API。
    location /api/ {
        proxy_pass http://bff:8080;
    }

    # 设计器、/demo/ 与静态资源统一交给 web 静态容器。
    location / {
        proxy_pass http://web:8080;
    }
}