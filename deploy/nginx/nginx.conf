# 独立入口（唯一对外服务）：HTTP 只保留健康检查，业务统一走 HTTPS。
# 容器内监听 8080 / 8443：nginx-unprivileged 以 uid 101 运行，不能绑定 80/443；
# 宿主机端口由 compose 的 NGINX_HTTP_PORT / NGINX_HTTPS_PORT 映射。
server {
    listen 8080;
    server_name _;

    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 健康检查走 HTTP，避免探针依赖证书；其余 HTTP 请求不承载业务。
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 ok;
    }

    location / {
        return 404;
    }
}

server {
    listen 8443 ssl;
    http2 on;

    # 证书覆盖的域名；证书文件由 compose 只读挂载到 /etc/nginx/certs。
    server_name devshare.bond www.devshare.bond;

    ssl_certificate     /etc/nginx/certs/www.devshare.bond.pem;
    ssl_certificate_key /etc/nginx/certs/www.devshare.bond.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 16m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 ok;
    }

    # 文件字节走 OSS STS 直传，这里只承载 JSON API。
    location /api/ {
        proxy_pass http://bff:8080;
    }

    # 设计器、/demo/ 与静态资源统一交给 web 静态容器。
    location / {
        proxy_pass http://web:8080;
    }
}
