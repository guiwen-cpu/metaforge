server {
    listen 8443 ssl http2;
    server_name meta.devshare.bond;

  # 证书路径（容器内路径）
  ssl_certificate     /etc/nginx/certs/www.devshare.bond.pem;
  ssl_certificate_key /etc/nginx/certs/www.devshare.bond.key;
  
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 16m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 文件字节走 OSS STS 直传，这里只承载 JSON API。
    location /api/ {
        proxy_pass http://bff:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /demo {
        return 302 /demo/;
    }

    # 出码示例应用：构建时写入 /demo/，SPA 深链接回落到 demo 的 index.html。
    location /demo/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /demo/index.html;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
