# staging / prod 使用：容器内 8080 只提供健康检查，业务走 8443（HTTPS）。
# compose 覆盖层会把它挂到 /etc/nginx/conf.d/default.conf，并映射宿主机 WEB_PORT → 8443；
# 证书目录 ../certs 以只读方式挂到 /etc/nginx/certs。
server {
    listen 8080;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 不对外映射 8080；即使误开也只暴露健康检查
    location / {
        return 404;
    }
}

server {
    listen 8443 ssl;
    http2 on;

    # 只写当前证书实际覆盖的域名；两个都写上，避免 Host 不一致时落到默认站点
    server_name devshare.bond www.devshare.bond;

    # 证书路径（容器内路径）；文件名需与目标机 deploy/../certs 下的文件一致
    ssl_certificate     /etc/nginx/certs/www.devshare.bond.pem;
    ssl_certificate_key /etc/nginx/certs/www.devshare.bond.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 16m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 文件字节走 OSS STS 直传，这里只承载 JSON API。
    location /api/ {
        proxy_pass http://bff:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /demo {
        return 302 /demo/;
    }

    # 出码示例应用：构建时写入 /demo/，SPA 深链接回落到 demo 的 index.html。
    location /demo/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /demo/index.html;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
