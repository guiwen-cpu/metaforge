name: metaforge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: metaforge
      POSTGRES_USER: metaforge_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 deploy/.env 设置}
      TZ: Asia/Shanghai
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metaforge_owner -d metaforge"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 deploy/.env 设置}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    restart: unless-stopped

  migrate:
    image: postgres:16-alpine
    profiles: [tools]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: metaforge_owner
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: metaforge
      META_FORGE_APP_PASSWORD: ${META_FORGE_APP_PASSWORD:?请在 deploy/.env 设置}
    volumes:
      - ./migrate:/migrations:ro
      - ../codegen/leave_approval/sql:/sql:ro
    entrypoint: ["/bin/sh", "/migrations/run.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]

  bff:
    build:
      context: ..
      dockerfile: deploy/bff/Dockerfile
    image: metaforge-bff:${TAG:-dev}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/metaforge
      SPRING_DATASOURCE_USERNAME: metaforge_app
      SPRING_DATASOURCE_PASSWORD: ${META_FORGE_APP_PASSWORD:?}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      LCP_TENANT_HEADER: X-Tenant-Id
      LCP_USER_HEADER: X-User-Id
      LCP_JWT_SECRET: ${LCP_JWT_SECRET:-metaforge-dev-secret-change-me}
      LCP_AUTH_ISSUER: ${LCP_AUTH_ISSUER:-metaforge}
      LCP_AUTH_TTL_HOURS: ${LCP_AUTH_TTL_HOURS:-12}
      # 开发环境保留演示会话头兜底；staging/prod 必须显式关闭。
      LCP_AUTH_DEV_HEADERS: ${LCP_AUTH_DEV_HEADERS:-true}
      LCP_SSO_ENABLED: ${LCP_SSO_ENABLED:-false}
      LCP_SSO_MODE: ${LCP_SSO_MODE:-oidc}
      LCP_SSO_PROVIDER: ${LCP_SSO_PROVIDER:-sso}
      LCP_SSO_DISPLAY_NAME: ${LCP_SSO_DISPLAY_NAME:-统一身份登录}
      LCP_SSO_TENANT: ${LCP_SSO_TENANT:-}
      LCP_SSO_CLIENT_ID: ${LCP_SSO_CLIENT_ID:-}
      LCP_SSO_CLIENT_SECRET: ${LCP_SSO_CLIENT_SECRET:-}
      LCP_SSO_AUTHORIZE_URL: ${LCP_SSO_AUTHORIZE_URL:-}
      LCP_SSO_TOKEN_URL: ${LCP_SSO_TOKEN_URL:-}
      LCP_SSO_USERINFO_URL: ${LCP_SSO_USERINFO_URL:-}
      LCP_SSO_JWKS_URL: ${LCP_SSO_JWKS_URL:-}
      LCP_SSO_ISSUER: ${LCP_SSO_ISSUER:-}
      LCP_SSO_SCOPES: ${LCP_SSO_SCOPES:-openid profile email}
      LCP_SSO_SUBJECT_CLAIM: ${LCP_SSO_SUBJECT_CLAIM:-sub}
      LCP_SSO_USERNAME_CLAIM: ${LCP_SSO_USERNAME_CLAIM:-preferred_username}
      LCP_SSO_EMAIL_CLAIM: ${LCP_SSO_EMAIL_CLAIM:-email}
      LCP_SSO_NAME_CLAIM: ${LCP_SSO_NAME_CLAIM:-name}
      LCP_SSO_REDIRECT_URI: ${LCP_SSO_REDIRECT_URI:-}
      LCP_SSO_FRONTEND_BASE_URL: ${LCP_SSO_FRONTEND_BASE_URL:-}
      LCP_SSO_FRONTEND_CALLBACK: ${LCP_SSO_FRONTEND_CALLBACK:-/sso/callback}
      LCP_SSO_CAS_SERVER_URL: ${LCP_SSO_CAS_SERVER_URL:-}
      LCP_SSO_CAS_VALIDATE_PATH: ${LCP_SSO_CAS_VALIDATE_PATH:-/p3/serviceValidate}
      LCP_SSO_CAS_ATTRIBUTES: ${LCP_SSO_CAS_ATTRIBUTES:-true}
      LCP_SSO_ALLOW_INSECURE_HTTP: ${LCP_SSO_ALLOW_INSECURE_HTTP:-false}
      LCP_SSO_LINK_BY: ${LCP_SSO_LINK_BY:-username}
      LCP_SSO_AUTO_CREATE: ${LCP_SSO_AUTO_CREATE:-false}
      LCP_SSO_STATE_TTL_MINUTES: ${LCP_SSO_STATE_TTL_MINUTES:-10}
      LCP_SSO_TICKET_TTL_SECONDS: ${LCP_SSO_TICKET_TTL_SECONDS:-60}
      LCP_IDENTITY_ALLOW_ALL: ${LCP_IDENTITY_ALLOW_ALL:-true}
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -Duser.timezone=Asia/Shanghai"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [edge, data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    image: metaforge-web:${TAG:-dev}
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      bff:
        condition: service_healthy
    networks: [edge]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

networks:
  edge: {}
  data:
    internal: true

volumes:
  pg_data: {}
  redis_data: {}
