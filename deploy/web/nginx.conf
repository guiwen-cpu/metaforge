# web 容器只负责静态资源；TLS 与 /api 反代由独立的 nginx 入口容器处理。
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 ok;
    }

    # 构建产物文件名带 hash，可长期缓存。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /demo {
        return 302 /demo/;
    }

    # 出码示例应用：构建时写入 /demo/，SPA 深链接回落到 demo 的 index.html。
    location /demo/ {
        add_header Cache-Control no-cache;
        try_files $uri $uri/ /demo/index.html;
    }

    location / {
        add_header Cache-Control no-cache;
        try_files $uri $uri/ /index.html;
    }
}
