# prod 覆盖层：镜像来自 GHCR，TAG 必须不可变（v1.2.3 / sha-xxxxxxx）。
# 与 staging 的差异：更严格的资源上限与 pull 策略。
services:
  bff:
    image: ghcr.io/guiwen-cpu/metaforge/bff:${TAG:?TAG 未设置}
    pull_policy: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
  web:
    image: ghcr.io/guiwen-cpu/metaforge/web:${TAG:?TAG 未设置}
    pull_policy: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
