# prod 覆盖层：镜像来自阿里云 ACR；CI 使用 sha-xxxxxxx，TAG 禁止 latest。
# ACR_REGISTRY / ACR_NAMESPACE 可用同环境变量覆盖；默认值与 release.sh、workflow 保持一致。
# 与 staging 的差异：更严格的资源上限与 pull 策略。
services:
  # 运行时不直接访问 Docker Hub：CI 会先把官方 postgres/redis 镜像同步到 ACR。
  postgres:
    image: ${ACR_REGISTRY:-registry.cn-hangzhou.aliyuncs.com}/${ACR_NAMESPACE:-metaforge}/postgres:16-alpine
  redis:
    image: ${ACR_REGISTRY:-registry.cn-hangzhou.aliyuncs.com}/${ACR_NAMESPACE:-metaforge}/redis:7-alpine
  migrate:
    image: ${ACR_REGISTRY:-registry.cn-hangzhou.aliyuncs.com}/${ACR_NAMESPACE:-metaforge}/postgres:16-alpine
  bff:
    image: ${ACR_REGISTRY:-registry.cn-hangzhou.aliyuncs.com}/${ACR_NAMESPACE:-metaforge}/bff:${TAG:?TAG 未设置}
    pull_policy: always
    environment:
      LCP_AUTH_DEV_HEADERS: "false"
      LCP_IDENTITY_ALLOW_ALL: "false"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
  web:
    image: ${ACR_REGISTRY:-registry.cn-hangzhou.aliyuncs.com}/${ACR_NAMESPACE:-metaforge}/web:${TAG:?TAG 未设置}
    pull_policy: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
  nginx:
    image: ${ACR_REGISTRY:-registry.cn-hangzhou.aliyuncs.com}/${ACR_NAMESPACE:-metaforge}/nginx:1.27-alpine
    pull_policy: always
    # 入口镜像由 CI 从上游同步到 ACR；配置与证书在运行时挂载
