# prod 覆盖层：镜像来自 GHCR；CI 使用 sha-xxxxxxx，TAG 禁止 latest。
# 与 staging 的差异：更严格的资源上限与 pull 策略。
services:
  bff:
    image: ghcr.io/guiwen-cpu/metaforge/bff:${TAG:?TAG 未设置}
    pull_policy: always
    environment:
      LCP_AUTH_DEV_HEADERS: "false"
      LCP_IDENTITY_ALLOW_ALL: "false"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
  web:
    image: ghcr.io/guiwen-cpu/metaforge/web:${TAG:?TAG 未设置}
    pull_policy: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
