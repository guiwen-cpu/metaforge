# prod 覆盖层：镜像来自阿里云 ACR；CI 使用 sha-xxxxxxx，TAG 禁止 latest。
# ACR_REGISTRY / ACR_NAMESPACE 可用同环境变量覆盖；默认值与 release.sh、workflow 保持一致。
# 与 staging 的差异：更严格的资源上限与 pull 策略。
services:
  bff:
    image: ${ACR_REGISTRY:-registry.cn-hangzhou.aliyuncs.com}/${ACR_NAMESPACE:-metaforge}/bff:${TAG:?TAG 未设置}
    pull_policy: always
    environment:
      LCP_AUTH_DEV_HEADERS: "false"
      LCP_IDENTITY_ALLOW_ALL: "false"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
  web:
    image: ${ACR_REGISTRY:-registry.cn-hangzhou.aliyuncs.com}/${ACR_NAMESPACE:-metaforge}/web:${TAG:?TAG 未设置}
    pull_policy: always
    # 生产对外走 HTTPS；容器端口由 release.sh 的 WEB_CONTAINER_PORT=8443 指定
    volumes:
      - ./nginx/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ../certs:/etc/nginx/certs:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
