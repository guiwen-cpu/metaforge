name: leave_approval-standalone

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leave_approval
      POSTGRES_USER: leave_approval
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leave_approval-local-pass}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leave_approval -d leave_approval"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/leave_approval
      SPRING_DATASOURCE_USERNAME: leave_approval
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-leave_approval-local-pass}
      LCP_DEMO_TENANT: tenant_demo_school
      LCP_DEMO_PASSWORD: ${LCP_DEMO_PASSWORD:-demo123}
      LCP_DEMO_TOKEN_SECRET: ${LCP_DEMO_TOKEN_SECRET:-leave_approval-demo-token-secret-change-me}
      LCP_DEMO_DEV_HEADERS: ${LCP_DEMO_DEV_HEADERS:-true}
      TZ: Asia/Shanghai
    ports:
      - "${SERVER_PORT:-8090}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${WEB_PORT:-8091}:8080"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  db_data: {}
